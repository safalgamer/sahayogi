services:
  - type: web
    name: sahayogi-api
    env: node
    repo: https://github.com/safalgamer/sahayogi
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://sahayogi-sme.netlify.app
      - key: PORT
        value: "5000"
